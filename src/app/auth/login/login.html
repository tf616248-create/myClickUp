<mat-card class="login-card">
  <mat-card-header>
    <mat-card-title>התחברות</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>אימייל</mat-label>
        <input matInput type="email" formControlName="email" placeholder="example@mail.com">
        <mat-error *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
          אימייל הוא שדה חובה
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          יש להזין כתובת אימייל תקינה
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>סיסמה</mat-label>
        <input matInput type="password" formControlName="password" placeholder="לפחות 6 תווים">
        <mat-error *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          סיסמה היא שדה חובה
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          הסיסמה חייבת להכיל לפחות 6 תווים
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" class="full-width">
        התחבר
      </button>

      @if (errorMessage) {
        <mat-error class="error-msg">{{ errorMessage }}</mat-error>
      }
    </form>
  </mat-card-content>
  <mat-card-actions align="end">
    <a mat-stroked-button routerLink="/register">עדיין אין לך חשבון? הירשם</a>
  </mat-card-actions>
</mat-card>
