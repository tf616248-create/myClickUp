<div>
    <h2>Register</h2>
    <mat-card class="register-card">
        <mat-card-header>
            <mat-card-title>יצירת חשבון חדש</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>שם מלא</mat-label>
                    <input matInput type="text" formControlName="name" placeholder="הכנס שם מלא">
                    <mat-error *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.hasError('required')">
                        שם מלא הוא שדה חובה
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('name')?.hasError('minlength')">
                        השם חייב להכיל לפחות 2 תווים
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>אימייל</mat-label>
                    <input matInput type="email" formControlName="email" placeholder="example@mail.com">
                    <mat-error *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">
                        אימייל הוא שדה חובה
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                        יש להזין כתובת אימייל תקינה
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>סיסמה</mat-label>
                    <input matInput type="password" formControlName="password" placeholder="לפחות 6 תווים">
                    <mat-error *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required')">
                        סיסמה היא שדה חובה
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                        הסיסמה חייבת להכיל לפחות 6 תווים
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>אימות סיסמה</mat-label>
                    <input matInput type="password" formControlName="confirmPassword" placeholder="הקלד שוב את הסיסמה">
                    <mat-error *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
                        הסיסמאות אינן תואמות
                    </mat-error>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="registerForm.invalid" class="full-width">
                    הירשם והתחל לעבוד
                </button>

                @if (errorMessage) {
                    <mat-error class="error-msg">{{ errorMessage }}</mat-error>
                }
            </form>
        </mat-card-content>
        <mat-card-actions align="end">
            <a mat-stroked-button routerLink="/login">כבר יש לך חשבון? התחבר</a>
        </mat-card-actions>
    </mat-card>
</div>
