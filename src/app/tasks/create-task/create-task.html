<mat-card class="create-card">
  <mat-card-header>
    <mat-card-title>יצירת משימה חדשה</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="taskForm" (ngSubmit)="saveTask()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>כותרת המשימה</mat-label>
        <input matInput formControlName="title" placeholder="למשל: לאפיין דף בית">
        <mat-error *ngIf="taskForm.get('title')?.hasError('required')">חובה להזין כותרת</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>תיאור</mat-label>
        <textarea matInput formControlName="description" placeholder="פירוט המשימה..."></textarea>
      </mat-form-field>

      <input type="hidden" formControlName="projectId">

      <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid || isSubmitting">
        <mat-progress-spinner *ngIf="isSubmitting" diameter="20" mode="indeterminate"></mat-progress-spinner>
        <span *ngIf="!isSubmitting">שמור משימה</span>
        <span *ngIf="isSubmitting">שומר...</span>
      </button>

      <div *ngIf="submitError" class="submit-error">
        <mat-error>{{ submitError }}</mat-error>
      </div>
    </form>
  </mat-card-content>
</mat-card>
